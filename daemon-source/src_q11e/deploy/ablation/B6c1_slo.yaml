apiVersion: v1
kind: Namespace
metadata:
  name: hhro-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hhro-daemon
  namespace: hhro-system
---
# Cluster-wide perms: only what the actuator needs.
# - Secrets in kube-system: create bootstrap-token-* for kubeadm join
# - Nodes: read for state, drain (later)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hhro-daemon
rules:
- apiGroups: [""]
  resources: [secrets]
  verbs: [create, delete, get, list]
- apiGroups: [""]
  resources: [nodes]
  verbs: [get, list, watch, patch, delete]
- apiGroups: [""]
  resources: [pods/eviction]
  verbs: [create]
- apiGroups: [""]
  resources: [pods]
  verbs: [get, list, watch, delete, create]  # v5.0: eUPF slot activation = bare pod create
- apiGroups: [apps]
  resources: [deployments]
  verbs: [get, list, watch, patch, create, delete]
# Phase 2b: UPF actuator clones configmaps/services from seed release and
# delete them on scale-in; also patches SMF configmap.
- apiGroups: [""]
  resources: [configmaps, services]
  verbs: [get, list, watch, create, patch, update, delete]
- apiGroups: [autoscaling]
  resources: [horizontalpodautoscalers]
  verbs: [get, list, watch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hhro-daemon
roleRef:
  kind: ClusterRole
  name: hhro-daemon
  apiGroup: rbac.authorization.k8s.io
subjects:
- kind: ServiceAccount
  name: hhro-daemon
  namespace: hhro-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hhro-daemon
  namespace: hhro-system
  labels: {app: hhro-daemon}
spec:
  replicas: 1
  selector: {matchLabels: {app: hhro-daemon}}
  template:
    metadata:
      labels: {app: hhro-daemon}
    spec:
      serviceAccountName: hhro-daemon
      # Pin to control-plane: daemon must NOT run on the workers it manages,
      # otherwise scale_in / drain evicts itself mid-flight.
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      containers:
      - name: daemon
        image: hhro-daemon:6.0-q11
        imagePullPolicy: IfNotPresent
        env:
        - {name: PROM_URL, value: "http://kps-kube-prometheus-stack-prometheus.monitoring.svc:9090"}
        - {name: MID_INTERVAL,  value: "30s"}
        - {name: SLOW_INTERVAL, value: "180s"}
        - {name: MAX_BW_BPS,    value: "25e9"}
        - {name: MAX_DROP_PPS,  value: "4000"}  # v4.41: 1000->4000, migration drop spikes (~1.6-2.3k) no longer max the dropUP term
        - {name: MAX_LAT_US,    value: "50000"}
        # Actuator
        - {name: HARVESTER_URL,        value: "https://10.0.0.193:6443"}
        - {name: HARVESTER_NAMESPACE,  value: "default"}
        - {name: WORKER_NAME_PREFIX,   value: "worker-"}
        - {name: WORKER_MGMT_PREFIX,   value: "10.0.0."}
        - {name: WORKER_MGMT_BASE,     value: "52"}
        - {name: WORKER_MGMT_GATEWAY,  value: "10.0.0.1"}
        - {name: WORKER_DATA_PREFIX,   value: "10.0.1."}
        - {name: WORKER_DATA_BASE,     value: "14"}
        - {name: WORKER_IMAGE_REF,   value: "default/worker-vm-template-v10-30g"}
        - {name: WORKER_STORAGECLASS,  value: "longhorn-worker-vm-template-v10-30g"}
        - {name: WORKER_NETWORK,       value: "default/anon-valn-1"}
        - {name: WORKER_VF_RESOURCE,   value: "mellanox.com/MT27800_FAMILY_CONNECTX5_VIRTUAL_FUNCTION"}
        - {name: WORKER_CPU_CORES,     value: "3"}
        - {name: WORKER_VF_COUNT,      value: "2"}
        - {name: WORKER_MEMORY_GI,     value: "3"}
        - {name: WORKER_DISK_GI,       value: "30"}
        - {name: VM_COOLDOWN,          value: "5m"}
        - {name: VM_STUCK_REAP_AFTER,  value: "30m"}  # measured from first-seen non-Running (NOT creation); worker-0 excluded entirely
        # ---- v5.0 eUPF ----
        - {name: EUPF_ENABLED,      value: "true"}
        - {name: HOST_MEM_RESERVE_GI, value: "3"}
        - {name: UP_PRESSURE_PPS_CAP, value: "1200000"}
