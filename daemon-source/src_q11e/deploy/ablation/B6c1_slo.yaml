        - {name: BASELINE_MODE,       value: "b6"}
        - {name: B6_U, value: "0.93"}
        - {name: B6_DWELL_UP, value: "300s"}
        - {name: B6_DWELL_VM, value: "600s"}
        - {name: B6_BACKTEST_W, value: "10"}
        - {name: B5_LEAD_TICKS_UP, value: "2"}
        - {name: B5_LEAD_TICKS_VY, value: "5"}
        - {name: B5_LEAD_TICKS_WK, value: "5"}
        - {name: DASA_N0, value: "1"}
        - {name: DASA_K_MAX, value: "2"}
        - {name: HPA_MIN, value: "2"}
        - {name: HPA_MAX, value: "8"}
        - {name: B6_MODELS, value: "{\"ar\":[0.0,-0.2120411944612835,0.0],\"holt\":[0.3,0.05],\"mlp\":{\"W1\":[[0.5032918287956744,-0.7267745582272538,0.041431714377602825,-0.1029741199266364,-0.1409919058662464,-0.10926096051861868,-0.5237761303031646,-0.06480417144623772,-0.38660795116181695,0.9218975067278025,0.11811512402597747,-0.09476165215270957,-0.10902239899848368,-0.2663802671801371,-0.3379482930792027,-0.10399061520590316],[0.12452956232809988,-0.09736330633908875,0.31483979180474425,-0.08443182852370419,-0.03665541704164892,0.4189942726099783,0.1747725899710626,-0.11253503258290713,-0.15546830650568622,0.08274352303007139,0.5505321656672857,-0.08322229687207384,-0.025067837805365582,0.2728592099169172,-0.22820887256895284,-0.022162229335561227],[0.27066201703143794,0.13494643178927096,-0.048305894073329976,0.2091437595422171,-0.7429952956347613,0.19602581381163103,-0.1789572516575198,-0.5096494487999362,0.0025531575878655582,0.1562995895840329,-0.02138550959014131,-0.26640890331351835,-0.20071797266545632,-0.02696348516778143,0.5015222141469998,0.17494977782191837],[0.1077657258090076,0.24586459735229932,0.03519574947168126,-0.30444912906391086,0.05966338077809617,0.09172881558528546,-0.09358375608557865,-0.16926668191252375,-0.06802856755234284,-0.7675167951890293,0.12073045459153936,0.12168401372650958,-0.33717043936115354,0.0018379295582002515,-0.1464577861360547,0.38380709515864136],[-0.44981665816621447,-0.3660957679095756,0.19722955384905633,0.33455928866470863,-0.5529904302405233,-0.3198922668335272,0.18231680832197805,-0.18800739201372288,0.36152086248848114,-0.39952902739425206,0.17745611660421037,-0.27851982128655767,0.2915513431061232,-0.0025009142267811858,0.04515693158498331,-0.4795256675844089],[0.4534272059906895,0.25620298031684324,0.14285178347848235,0.41254461311593815,0.14542266026494485,-0.24873808786670565,-0.1435574816365715,-0.24038295863403242,0.2796113744685469,-0.4318588172389123,-0.1019609468640271,-0.07658849607464606,0.060647